services:
  mysql:
    image: mysql:8.0
    container_name: storerate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-storerate_db}
      MYSQL_USER: ${DB_USER:-storerate_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-storerate_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 15s
    networks:
      - storerate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storerate-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-5001}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-storerate_user}
      DB_PASSWORD: ${DB_PASSWORD:-storerate_password}
      DB_NAME: ${DB_NAME:-storerate_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this_in_production_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@storerating.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - storerate-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storerate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - storerate-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      timeout: 3s
      retries: 3
      interval: 10s
      start_period: 5s

volumes:
  mysql_data:
    driver: local

networks:
  storerate-network:
    driver: bridge
